<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voice Transcriber</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e5e5e5;
    --text-dim: #888;
    --accent: #25D366;
    --accent-dim: #1a9e4a;
    --danger: #e74c3c;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 2rem 1.25rem;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  header h1 {
    font-size: 1.375rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }

  header p {
    color: var(--text-dim);
    font-size: 0.8125rem;
  }

  /* Model banner */
  .model-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 1rem;
    margin-bottom: 1.25rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    display: none;
  }

  .model-banner.visible { display: block; }

  .model-banner .progress-bar {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin-top: 0.5rem;
    overflow: hidden;
  }

  .model-banner .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width 0.3s;
  }

  /* Drop Zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2.5rem 1.25rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 1.5rem;
    -webkit-tap-highlight-color: transparent;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(37, 211, 102, 0.04);
  }

  .drop-zone-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .drop-zone-text { font-size: 0.9375rem; margin-bottom: 0.25rem; }
  .drop-zone-hint { font-size: 0.75rem; color: var(--text-dim); }
  .drop-zone input[type="file"] { display: none; }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 0.75rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.875rem 1rem;
    border-bottom: 1px solid var(--border);
  }

  .card-filename {
    font-size: 0.8125rem;
    font-weight: 500;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-status {
    font-size: 0.6875rem;
    padding: 0.1875rem 0.5rem;
    border-radius: 999px;
    font-weight: 500;
    white-space: nowrap;
  }

  .card-status.ready {
    background: rgba(37, 211, 102, 0.12);
    color: var(--accent);
  }

  .card-status.loading {
    background: rgba(37, 211, 102, 0.12);
    color: var(--accent);
  }

  .card-status.done {
    background: rgba(37, 211, 102, 0.12);
    color: var(--accent);
  }

  .card-status.error {
    background: rgba(231, 76, 60, 0.12);
    color: var(--danger);
  }

  .card-body { padding: 0.875rem 1rem; }

  .card-audio {
    width: 100%;
    border-radius: 8px;
    height: 40px;
  }

  .card-text {
    font-size: 0.8125rem;
    line-height: 1.6;
    white-space: pre-wrap;
    margin-top: 0.75rem;
    color: var(--text-dim);
    font-style: italic;
  }

  .card-text.final {
    color: var(--text);
    font-style: normal;
  }

  .card-actions {
    display: flex;
    gap: 0.5rem;
    padding: 0.625rem 1rem;
    border-top: 1px solid var(--border);
  }

  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.75rem;
    padding: 0.4375rem 0.75rem;
    cursor: pointer;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover { background: var(--border); }

  .btn-remove {
    margin-left: auto;
    color: var(--text-dim);
  }

  /* Spinner */
  .spinner {
    display: inline-block;
    width: 10px;
    height: 10px;
    border: 1.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: middle;
    margin-right: 0.25rem;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 1rem;
    font-size: 0.8125rem;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    z-index: 100;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Voice Transcriber</h1>
    <p>On-device transcription for WhatsApp voice messages</p>
  </header>

  <div class="model-banner" id="modelBanner">
    <span id="modelStatus">Loading Whisper model...</span>
    <div class="progress-bar"><div class="progress-fill" id="modelProgress"></div></div>
  </div>

  <div class="drop-zone" id="dropZone">
    <div class="drop-zone-icon">🎙</div>
    <div class="drop-zone-text">Tap to select audio files</div>
    <div class="drop-zone-hint">m4a, ogg, opus, mp3, wav, webm</div>
    <input type="file" id="fileInput" multiple accept=".m4a,.ogg,.opus,.mp3,.wav,.webm,audio/*" />
  </div>

  <div class="cards" id="cards"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';

const SUPPORTED = new Set(['m4a', 'ogg', 'opus', 'mp3', 'wav', 'webm', 'mp4', 'mpeg', 'mpga']);
const MODEL_ID = 'onnx-community/whisper-tiny';

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const cardsEl = document.getElementById('cards');
const modelBanner = document.getElementById('modelBanner');
const modelStatus = document.getElementById('modelStatus');
const modelProgress = document.getElementById('modelProgress');

// --- Whisper pipeline (lazy-loaded, singleton) ---
let transcriber = null;
let transcriberLoading = false;
const transcriberQueue = []; // callbacks waiting for model

async function getTranscriber() {
  if (transcriber) return transcriber;

  if (transcriberLoading) {
    return new Promise(resolve => transcriberQueue.push(resolve));
  }

  transcriberLoading = true;
  modelBanner.classList.add('visible');
  modelStatus.textContent = 'Downloading Whisper model (~40 MB, cached after first load)...';

  try {
    transcriber = await pipeline(
      'automatic-speech-recognition',
      MODEL_ID,
      {
        dtype: 'q8',
        device: 'wasm',
        progress_callback: (progress) => {
          if (progress.status === 'progress' && progress.total) {
            const pct = Math.round((progress.loaded / progress.total) * 100);
            modelProgress.style.width = pct + '%';
            modelStatus.textContent = `Downloading model... ${pct}%`;
          } else if (progress.status === 'ready') {
            modelProgress.style.width = '100%';
            modelStatus.textContent = 'Model ready';
            setTimeout(() => modelBanner.classList.remove('visible'), 1500);
          }
        },
      }
    );
  } catch (e) {
    modelStatus.textContent = `Failed to load model: ${e.message}`;
    transcriberLoading = false;
    throw e;
  }

  // Resolve any queued callers
  for (const resolve of transcriberQueue) resolve(transcriber);
  transcriberQueue.length = 0;

  return transcriber;
}

// --- Decode audio file to 16kHz mono Float32Array ---
async function decodeAudio(file) {
  const arrayBuffer = await file.arrayBuffer();
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const decoded = await audioCtx.decodeAudioData(arrayBuffer);

  // Mix down to mono
  const length = decoded.length;
  const mono = new Float32Array(length);
  const channels = decoded.numberOfChannels;
  for (let ch = 0; ch < channels; ch++) {
    const chData = decoded.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      mono[i] += chData[i];
    }
  }
  if (channels > 1) {
    for (let i = 0; i < length; i++) {
      mono[i] /= channels;
    }
  }

  await audioCtx.close();
  return mono;
}

// --- Transcription ---
async function transcribeFile(file, card) {
  card.setStatus('loading', '<span class="spinner"></span>loading model');

  let asr;
  try {
    asr = await getTranscriber();
  } catch (e) {
    card.setText(`Error loading model: ${e.message}`);
    card.setStatus('error', 'failed');
    return;
  }

  card.setStatus('loading', '<span class="spinner"></span>decoding audio');

  let audio;
  try {
    audio = await decodeAudio(file);
  } catch (e) {
    card.setText(`Error decoding audio: ${e.message}`);
    card.setStatus('error', 'failed');
    return;
  }

  card.setStatus('loading', '<span class="spinner"></span>transcribing');
  card.setText('Transcribing...');

  try {
    const result = await asr(audio, { language: 'en', task: 'transcribe' });
    card.setText(result.text.trim());
    card.setStatus('done', 'done');
    card.showActions();
  } catch (e) {
    card.setText(`Error: ${e.message}`);
    card.setStatus('error', 'failed');
  }
}

// --- File handling ---
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

function addFiles(fileList) {
  for (const file of fileList) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!SUPPORTED.has(ext)) {
      showToast(`Unsupported: .${ext}`);
      continue;
    }
    const card = createCard(file);
    transcribeFile(file, card);
  }
}

// --- Card UI ---
function createCard(file) {
  const el = document.createElement('div');
  el.className = 'card';

  const audioURL = URL.createObjectURL(file);

  el.innerHTML = `
    <div class="card-header">
      <span class="card-filename"></span>
      <span class="card-status ready">ready</span>
    </div>
    <div class="card-body">
      <audio class="card-audio" controls preload="metadata" src="${audioURL}"></audio>
      <div class="card-text">Waiting...</div>
    </div>
    <div class="card-actions" style="display:none">
      <button class="btn btn-copy">Copy</button>
      <button class="btn btn-download">Download .txt</button>
      <button class="btn btn-remove">Remove</button>
    </div>
  `;

  el.querySelector('.card-filename').textContent = file.name;

  const textEl = el.querySelector('.card-text');
  const statusEl = el.querySelector('.card-status');
  const actionsEl = el.querySelector('.card-actions');

  el.querySelector('.btn-copy').addEventListener('click', () => {
    navigator.clipboard.writeText(textEl.textContent).then(() => showToast('Copied'));
  });

  el.querySelector('.btn-download').addEventListener('click', () => {
    const blob = new Blob([textEl.textContent], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name.replace(/\.[^.]+$/, '') + '.txt';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  el.querySelector('.btn-remove').addEventListener('click', () => {
    URL.revokeObjectURL(audioURL);
    el.remove();
  });

  cardsEl.prepend(el);

  return {
    setText(text) {
      textEl.textContent = text;
      textEl.classList.toggle('final', !text.startsWith('Error') && !text.startsWith('Waiting') && !text.startsWith('Transcribing'));
    },
    setStatus(type, label) {
      statusEl.className = `card-status ${type}`;
      statusEl.innerHTML = label;
    },
    showActions() {
      actionsEl.style.display = 'flex';
    },
  };
}

// --- Toast ---
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
