<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voice Transcriber</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e5e5e5;
    --text-dim: #888;
    --accent: #25D366;
    --accent-dim: #1a9e4a;
    --danger: #e74c3c;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    line-height: 1.5;
    -webkit-text-size-adjust: 100%;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 2rem 1.25rem;
  }

  header {
    text-align: center;
    margin-bottom: 2rem;
  }

  header h1 {
    font-size: 1.375rem;
    font-weight: 600;
    margin-bottom: 0.25rem;
  }

  header p {
    color: var(--text-dim);
    font-size: 0.8125rem;
  }

  /* Drop Zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2.5rem 1.25rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 1.5rem;
    -webkit-tap-highlight-color: transparent;
  }

  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(37, 211, 102, 0.04);
  }

  .drop-zone-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .drop-zone-text { font-size: 0.9375rem; margin-bottom: 0.25rem; }
  .drop-zone-hint { font-size: 0.75rem; color: var(--text-dim); }
  .drop-zone input[type="file"] { display: none; }

  /* Cards */
  .cards { display: flex; flex-direction: column; gap: 0.75rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.875rem 1rem;
    border-bottom: 1px solid var(--border);
  }

  .card-filename {
    font-size: 0.8125rem;
    font-weight: 500;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-status {
    font-size: 0.6875rem;
    padding: 0.1875rem 0.5rem;
    border-radius: 999px;
    font-weight: 500;
    white-space: nowrap;
  }

  .card-status.ready {
    background: rgba(37, 211, 102, 0.12);
    color: var(--accent);
  }

  .card-body { padding: 0.875rem 1rem; }

  .card-audio {
    width: 100%;
    border-radius: 8px;
    height: 40px;
  }

  .card-text {
    font-size: 0.8125rem;
    line-height: 1.6;
    white-space: pre-wrap;
    margin-top: 0.75rem;
    color: var(--text-dim);
    font-style: italic;
  }

  .card-actions {
    display: flex;
    gap: 0.5rem;
    padding: 0.625rem 1rem;
    border-top: 1px solid var(--border);
  }

  .btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.75rem;
    padding: 0.4375rem 0.75rem;
    cursor: pointer;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:hover { background: var(--border); }

  .btn-remove {
    margin-left: auto;
    color: var(--text-dim);
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 1rem;
    font-size: 0.8125rem;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    z-index: 100;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8125rem;
    padding: 1rem 0;
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Voice Transcriber</h1>
    <p>On-device transcription for WhatsApp voice messages</p>
  </header>

  <div class="drop-zone" id="dropZone">
    <div class="drop-zone-icon">🎙</div>
    <div class="drop-zone-text">Tap to select audio files</div>
    <div class="drop-zone-hint">m4a, ogg, opus, mp3, wav, webm</div>
    <input type="file" id="fileInput" multiple accept=".m4a,.ogg,.opus,.mp3,.wav,.webm,audio/*" />
  </div>

  <div class="cards" id="cards"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPPORTED = new Set(['m4a', 'ogg', 'opus', 'mp3', 'wav', 'webm', 'mp4', 'mpeg', 'mpga']);

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const cardsEl = document.getElementById('cards');

// --- File handling ---
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });

function addFiles(fileList) {
  for (const file of fileList) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!SUPPORTED.has(ext)) {
      showToast(`Unsupported: .${ext}`);
      continue;
    }
    createCard(file);
  }
}

// --- Card UI ---
function createCard(file) {
  const el = document.createElement('div');
  el.className = 'card';

  const audioURL = URL.createObjectURL(file);

  el.innerHTML = `
    <div class="card-header">
      <span class="card-filename"></span>
      <span class="card-status ready">ready</span>
    </div>
    <div class="card-body">
      <audio class="card-audio" controls preload="metadata" src="${audioURL}"></audio>
      <div class="card-text">Transcription will appear here</div>
    </div>
    <div class="card-actions">
      <button class="btn btn-remove">Remove</button>
    </div>
  `;

  // Set filename via textContent to avoid XSS
  el.querySelector('.card-filename').textContent = file.name;

  el.querySelector('.btn-remove').addEventListener('click', () => {
    URL.revokeObjectURL(audioURL);
    el.remove();
  });

  cardsEl.prepend(el);
}

// --- Toast ---
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
